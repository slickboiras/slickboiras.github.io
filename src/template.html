<title>Farras Artboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Jersey+10&display=swap">
<style>
/* Layout: a design-app shell (top bar, left tools, right layers) floating over an
   infinite canvas. Artboards live in world space; the background is a live
   ordered-dither texture taken from the profile picture's look.
   ART mode = green duotone (the designer). X-RAY mode = blueprint blue (the engineer). */
:root {
  color-scheme: dark;
  /* Art-mode palette. JS rewrites these when the eyedropper picks a new accent. */
  --accent: #9ccc87;      /* light green from the pfp */
  --accent-ink: #10180e;  /* text that sits on the accent */
  --bg-0: #121a10;        /* canvas dark tone */
  --bg-1: #24361f;        /* canvas light tone */
  --panel: rgba(16, 22, 14, .9);
  --line: #2e3e2a;
  --fg: #e3eadc;
  --muted: #93a28c;
  --paper: #e7eadf;       /* artboard paper */
  --ink: #10150e;         /* artboard ink */
  --deep: #0c110b;        /* dark artboard fill */
  --marker: #e5281b;      /* red marker from the PDF portfolio, never re-themed */

  /* X-ray (blueprint) palette, fixed */
  --bp: #2d46d6;          /* cobalt */
  --bp-deep: #1a2a9e;
  --bp-line: #6cc8ec;     /* cyan grid lines */
  --bp-fg: #e2e8ff;
  --f-pixel: "Jersey 10", "IBM Plex Mono", ui-monospace, monospace;
  --noise: none;          /* generated at boot */

  --f-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --z: 1; /* current zoom, written by JS so labels and handles can counter-scale */
}
body.xray {
  --panel: rgba(20, 32, 150, .9);
  --line: rgba(108, 200, 236, .35);
  --fg: var(--bp-fg);
  --muted: #a8b8f5;
}
html, body { height: 100%; }
h1, h2, h3, p, ul, figure, figcaption, pre { margin: 0; padding: 0; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--fg);
  font: 15px/1.5 var(--f-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body.xray :focus-visible { outline-color: #fff; }

/* ---------- Stage & background ---------- */
#stage {
  position: fixed; inset: 0; overflow: hidden;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#bg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  image-rendering: pixelated; display: block;
}
body.xray #bg { opacity: 0; }
/* X-ray: retro perspective grid room (floor + ceiling) drawn on #xg */
#xg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: none; }
body.xray #xg { display: block; }
body.xray #stage { background-color: var(--bp); }
/* CRT-ish grain + faint scanlines over the whole x-ray scene */
#grain { position: fixed; inset: 0; z-index: 16; pointer-events: none; display: none;
  background-image: var(--noise), repeating-linear-gradient(0deg, rgba(0,0,40,.12) 0 1px, transparent 1px 3px);
  opacity: .5; mix-blend-mode: overlay; animation: grain .5s steps(4) infinite; }
body.xray #grain { display: block; }
@keyframes grain { 0% { background-position: 0 0, 0 0 } 25% { background-position: -40px 20px, 0 0 } 50% { background-position: 30px -50px, 0 0 } 75% { background-position: -20px -30px, 0 0 } }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

/* ---------- Artboards ---------- */
.ab { position: absolute; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
.ab-label {
  position: absolute; left: 0; bottom: 100%;
  padding-bottom: calc(6px / var(--z));
  font: 500 calc(12px / var(--z))/1 var(--f-mono);
  color: var(--muted); white-space: nowrap; cursor: grab;
  display: flex; gap: calc(8px / var(--z)); align-items: baseline;
}
.ab-label b { color: var(--fg); font-weight: 500; }
.ab.selected .ab-label b { color: var(--accent); }
body.xray .ab.selected .ab-label b { color: var(--bp-fg); }
.ab-body { position: absolute; inset: 0; overflow: hidden; }

/* selection box */
#sel { position: absolute; pointer-events: none; border: calc(1.5px / var(--z)) solid var(--accent); display: none; }
#sel i {
  position: absolute; width: calc(9px / var(--z)); height: calc(9px / var(--z));
  background: var(--paper); border: calc(1.5px / var(--z)) solid var(--accent);
  transform: translate(-50%, -50%);
}
body.xray #sel, body.xray #sel i { border-color: var(--bp-line); }
body.xray #sel i { background: var(--bp-deep); }

/* measurement lines (x-ray only) */
.meas { position: absolute; display: none; color: var(--bp-line); font: 400 calc(15px / var(--z))/1 var(--f-pixel); letter-spacing: .04em; }
.meas.mw { left: 0; right: 0; top: calc(-26px / var(--z)); border-top: 1px solid var(--bp-line); }
.meas.mh { top: 0; bottom: 0; left: calc(-26px / var(--z)); border-left: 1px solid var(--bp-line); }
.meas span { position: absolute; background: var(--bp); padding: 0 .4em; }
.meas.mw span { left: 50%; top: 0; transform: translate(-50%, -50%); }
.meas.mh span { top: 50%; left: 0; transform: translate(-50%, -50%) rotate(-90deg); }
body.xray .meas { display: block; }
body.xray .ab-label { top: calc(-48px / var(--z)); bottom: auto; }

/* x-ray notes */
.note {
  display: none; position: absolute; z-index: 3;
  font: 500 12px/1.35 var(--f-mono); color: var(--bp-fg);
  background: rgba(20, 30, 140, .9); border: 1px dashed var(--bp-line);
  padding: 6px 9px; white-space: nowrap;
}
.note::before { content: "↳ "; opacity: .7; }
body.xray .note { display: block; }

/* x-ray: everything becomes outlines on blueprint */
body.xray .ab { background: rgba(45, 70, 214, .72) !important; box-shadow: 0 0 0 1px rgba(108,200,236,.15), 0 0 40px rgba(108,200,236,.12); outline: 1.5px dashed var(--bp-line); }
body.xray .ab-label { color: var(--bp-line); font-family: var(--f-pixel); font-size: calc(16px / var(--z)); font-weight: 400; letter-spacing: .04em; }
/* headings turn into chunky bitmap type, like an old screen */
body.xray .ab-body :is(h1, h2, h3) {
  font-family: var(--f-pixel); font-weight: 400; font-variation-settings: normal;
  letter-spacing: .01em; color: var(--bp-fg); text-shadow: 0 0 14px rgba(108, 200, 236, .55);
}
body.xray .cover h1 { font-size: 200px; line-height: .78; }
body.xray .ab-body .eyebrow, body.xray .ab-body .chip, body.xray .card .status { color: var(--bp-line); }
body.xray .ab-body { color: var(--bp-fg) !important; }
body.xray .ab-body :where(h1, h2, h3, p, li, .chip, .frame, .card, .row, .pfp, .skills > div) {
  outline: 1px dashed rgba(108, 200, 236, .4); outline-offset: 3px;
}
body.xray .ab-body * { border-color: rgba(108, 200, 236, .6) !important; }
body.xray .ab-body .chip { background: transparent; }

/* Cover */
#ab-cover { background: var(--paper); color: var(--ink); }
.cover { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 420px; gap: 40px; padding: 64px; }
.eyebrow { font: 500 13px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
.cover h1 {
  font: 800 168px/.82 var(--f-display); font-stretch: 82%; font-optical-sizing: auto;
  letter-spacing: .01em; margin: 34px 0 0 -6px; white-space: nowrap;
}
/* each letter reacts to the cursor: lighter + wider + lifted near it (--k: 0..1) */
.ch {
  --k: 0; display: inline-block;
  font-weight: calc(800 - var(--k) * 480); font-stretch: calc(82% + var(--k) * 18%);
  transform: translateY(calc(var(--k) * -16px));
  transition: font-weight .25s, font-stretch .25s, transform .25s;
}
.ch.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { scale: 1 1 } 35% { scale: 1.08 .86 } 70% { scale: .96 1.07 } 100% { scale: 1 1 } }
body.xray .ch { font-weight: 400; font-stretch: 100%; }
.cover blockquote { margin: 40px 0 0; max-width: 100%; }
.qwrap { position: relative; }
/* "room full of mirrors": hover the quote and it echoes + reflects */
.cover .thesis { transition: text-shadow .3s; }
.cover blockquote:hover .thesis:not(.mirror) {
  text-shadow: 3px 3px 0 color-mix(in srgb, var(--accent) 90%, transparent),
               7px 7px 0 color-mix(in srgb, var(--accent) 55%, transparent),
               12px 12px 0 color-mix(in srgb, var(--accent) 25%, transparent);
}
.mirror {
  position: absolute; left: 0; right: 0; top: 100%; transform: scaleY(-1); pointer-events: none;
  opacity: 0; transition: opacity .35s; filter: blur(.6px);
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.55), transparent 55%); mask-image: linear-gradient(to top, rgba(0,0,0,.55), transparent 55%);
}
.cover blockquote:hover .mirror { opacity: 1; }
body.xray .mirror { display: none; }
.cover .thesis { font: 500 26px/1.22 var(--f-display); font-variation-settings: "wdth" 88; letter-spacing: .005em; text-wrap: balance; }
.cover cite { display: block; margin-top: 30px; font: 500 12px var(--f-mono); font-style: normal; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.cover .meta { position: absolute; left: 64px; bottom: 56px; display: flex; gap: 28px; font: 500 13px var(--f-mono); }
.cover .meta span::before { content: "■ "; color: var(--accent); }
body.xray .cover .meta span::before { color: var(--bp-line); }
.pfp {
  --rx: 0deg; --ry: 0deg; --gx: 50%; --gy: 50%;
  position: relative; align-self: center; aspect-ratio: 1; width: 100%; background: var(--ink); cursor: zoom-in;
  /* tilts toward the cursor and thumps on every kick while the record plays */
  transform: perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) scale(calc(1 + var(--beat, 0) * .035));
  transition: transform .18s ease-out; transform-style: preserve-3d;
}
.pfp::after {
  content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(circle at var(--gx) var(--gy), rgba(255,255,255,.28), transparent 45%);
  mix-blend-mode: screen;
}
.pfp:hover::after { opacity: 1; }

/* now playing: record slides out of its sleeve on hover, spins while playing */
.np { position: absolute; left: 64px; bottom: 44px; display: flex; align-items: center; gap: 20px; }
.deck { position: relative; width: 176px; height: 96px; flex-shrink: 0; }
.sleeve {
  position: absolute; inset: 0 auto 0 0; width: 96px; z-index: 2;
  background: radial-gradient(var(--ink) 1.1px, transparent 1.7px) 0 0 / 6px 6px, var(--accent);
  display: grid; place-items: center; box-shadow: 3px 3px 0 var(--ink);
  font: 800 34px/1 var(--f-display); color: var(--ink);
}
.sleeve span { background: var(--accent); padding: 0 6px; }
.slide { display: block; position: absolute; left: 6px; top: 4px; width: 88px; height: 88px; transition: transform .55s cubic-bezier(.2, .9, .25, 1); }
.deck:hover .slide, .deck.playing .slide, .deck:focus-visible .slide { transform: translateX(76px); }
.disc {
  display: block; width: 100%; height: 100%; border-radius: 50%;
  background:
    conic-gradient(from 20deg, transparent 0 8%, rgba(255,255,255,.16) 12%, transparent 18% 58%, rgba(255,255,255,.1) 62%, transparent 68%),
    repeating-radial-gradient(circle, #141414 0 1.4px, #262626 1.4px 2.8px);
  animation: spin 2.2s linear infinite paused; position: relative;
}
.disc::after { content: ""; position: absolute; inset: 33%; border-radius: 50%; background: radial-gradient(var(--ink) 0 2.5px, var(--accent) 3px); }
.deck:hover .disc { animation-play-state: running; animation-duration: 5s; }
.deck.playing .disc { animation-play-state: running; animation-duration: 1.8s; }
@keyframes spin { to { rotate: 360deg; } }
.np-meta { display: grid; gap: 6px; min-width: 0; max-width: 250px; }
.np-k { font: 500 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.socials { position: absolute; right: 64px; top: 58px; display: flex; gap: 18px; font: 500 12px var(--f-mono); letter-spacing: .06em; z-index: 2; }
.socials a { color: inherit; text-decoration: none; border-bottom: 1.5px solid var(--marker); padding-bottom: 1px; }
.socials a:hover { background: var(--accent); }
body.xray .socials a { border-color: var(--bp-line); }
.np-title { font: 700 24px/1.05 var(--f-display); font-stretch: 85%; }
.np-artist { font-size: 14px; }
.np-artist a { color: inherit; }
.np-list { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 500 15px/1.3 var(--f-body); max-width: 240px; }
.np-list a { color: inherit; text-decoration: none; border-bottom: 1.5px solid transparent; }
.np-list a:hover { border-color: currentColor; }
.eq { width: 200px; height: 32px; image-rendering: pixelated; display: block; }
body.xray .sleeve { background: transparent; box-shadow: none; outline: 1px dashed var(--bp-line); color: var(--bp-fg); font-family: var(--f-pixel); font-weight: 400; }
body.xray .sleeve span { background: transparent; }
body.xray .disc { background: repeating-radial-gradient(circle, transparent 0 3px, rgba(108,200,236,.55) 3px 4px); }
body.xray .disc::after { background: var(--bp-deep); outline: 1px solid var(--bp-line); }
.pfp img, .frame .src { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dith {
  position: absolute; inset: 0; width: 100%; height: 100%;
  image-rendering: pixelated; transition: opacity .4s steps(5);
}
.pfp:hover .dith, .frame:hover .dith, .reveal .dith { opacity: 0; }
.pfp-cap { position: absolute; left: 0; top: 100%; margin-top: 10px; font: 500 12px var(--f-mono); opacity: .7; }

/* About */
#ab-about { background: var(--accent); color: var(--accent-ink); }
.about { position: absolute; inset: 0; padding: 56px; display: flex; flex-direction: column; gap: 22px; }
.about-row { display: grid; grid-template-columns: 1fr 190px; gap: 28px; align-items: start; }
.sticker { transform: rotate(4deg); transition: transform .35s cubic-bezier(.2, .9, .3, 1.4); }
.sticker:hover { transform: rotate(-2deg) scale(1.05); }
.sticker .tag {
  display: block; position: relative; z-index: 2; margin: 0 -14px -8px -10px; padding: 6px 8px;
  background: var(--ink); color: var(--paper); transform: rotate(-4deg);
  font: 800 19px/1 var(--f-display); font-stretch: 75%; text-transform: uppercase; white-space: nowrap;
}
.sticker .frame { box-shadow: 4px 4px 0 var(--ink); }
.sticker small { display: block; margin-top: 10px; font: 500 12px var(--f-mono); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tools b { font: 500 12px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; margin-right: 6px; }
body.xray .sticker .tag { background: transparent; color: var(--bp-fg); outline: 1px dashed var(--bp-line); }
.about h2 { font: 800 76px/.88 var(--f-display); font-variation-settings: "wdth" 75; letter-spacing: -.02em; text-wrap: balance; }
.about p { font-size: 16px; line-height: 1.55; max-width: 46ch; }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: auto; }
.skills h3 { font: 500 12px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; border-bottom: 1.5px solid currentColor; padding-bottom: 8px; margin-bottom: 10px; }
.skills ul { list-style: none; display: grid; gap: 6px; font-size: 15px; }
.heading { font: 500 13px var(--f-mono); border-top: 1.5px solid currentColor; padding-top: 14px; }

/* Works */
#ab-works { background: var(--deep); color: var(--paper); }
.works { position: absolute; inset: 0; padding: 56px; display: flex; flex-direction: column; gap: 28px; }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
.sec-head h2 { font: 800 84px/.85 var(--f-display); font-variation-settings: "wdth" 75; letter-spacing: -.02em; }
.sec-head p { font: 500 12px/1.5 var(--f-mono); opacity: .7; text-align: right; }
.wgrid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; align-items: start; }
.pgrid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; align-items: start; }
.pcol { display: grid; gap: 26px; }
.sec-head { position: relative; z-index: 1; }
.work { display: grid; gap: 10px; }
/* pieces sit slightly crooked like prints pinned to a wall; hover straightens + lifts them */
.tilt { transform: rotate(var(--r, 0deg)); transition: transform .35s cubic-bezier(.2, .9, .3, 1.3); position: relative; }
.tilt:hover { transform: rotate(0deg) translateY(-8px) scale(1.03); z-index: 3; }
.frame { position: relative; aspect-ratio: 4 / 3; background: var(--ink); overflow: hidden; cursor: zoom-in; box-shadow: 5px 5px 0 rgba(0, 0, 0, .28); }
.sec-head h2.shout { font-size: 112px; line-height: .82; text-transform: uppercase; letter-spacing: -.01em; }
.sec-head a { color: inherit; }
.fuzz { filter: url(#fuzz); }
body.xray .fuzz { filter: none; }
.scrib { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
body.xray .scrib { display: none; }

/* Documentation */
#ab-docs { background: var(--paper); color: var(--ink); }
#ab-docs::after { content: ""; position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 5; }
#ab-docs.flash::after { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: .92; } 100% { opacity: 0; } }
.docs { position: absolute; inset: 0; padding: 56px; display: flex; flex-direction: column; gap: 28px; }
.cam {
  position: absolute; right: 70px; bottom: 44px; z-index: 2; width: 220px; text-align: center;
  transform: rotate(7deg); transition: transform .4s cubic-bezier(.2, .9, .3, 1.4);
}
.cam:hover { transform: rotate(-3deg) scale(1.07); }
.cam:active { transform: rotate(-3deg) scale(.97); }
.cam img { display: block; width: 100%; mix-blend-mode: multiply; }
.cam small { display: block; margin-top: 4px; font: 500 12px var(--f-mono); }
.work-cap { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.work-cap small { font: 500 11px var(--f-mono); opacity: .65; }
.chip {
  display: inline-block; font: 500 10.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase;
  padding: 5px 7px; border: 1px solid currentColor; border-radius: 2px;
}
.frame .chip { position: absolute; top: 10px; left: 10px; z-index: 2; background: var(--deep); color: var(--accent); border-color: var(--accent); }

/* Tech */
#ab-tech { background: var(--paper); color: var(--ink); }
.tech { position: absolute; inset: 0; padding: 56px; display: flex; flex-direction: column; gap: 28px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; }
.card { border: 1.5px solid var(--ink); padding: 26px; display: flex; flex-direction: column; gap: 12px; position: relative; }
.card h3 { font: 700 34px/1 var(--f-display); font-variation-settings: "wdth" 80; }
.card p { font-size: 16px; max-width: 46ch; }
.card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.card .status { position: absolute; top: 22px; right: 22px; font: 500 11px var(--f-mono); }
.card .status::before { content: "● "; color: var(--accent); }
.card.ghost { border-style: dashed; opacity: .6; }
.schem { display: none; font: 500 13px/1.35 var(--f-mono); white-space: pre; color: var(--bp-line); }
body.xray .schem { display: block; }
body.xray .card p { display: none; }

/* Contact */
#ab-contact { background: var(--ink); color: var(--paper); }
.contact { position: absolute; inset: 0; padding: 56px; display: flex; flex-direction: column; gap: 32px; }
.contact h2 { font: 800 84px/.84 var(--f-display); font-variation-settings: "wdth" 75; letter-spacing: -.025em; color: var(--accent); }
body.xray .contact h2 { color: var(--bp-fg); }
.rows { display: grid; margin-top: auto; }
.row { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid rgba(231,234,223,.25); }
.row span { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
.row a, .row code { color: inherit; font: 500 16px var(--f-body); text-decoration: none; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.row a:hover { color: var(--accent); }
.mini { font: 500 11px var(--f-mono); border: 1px solid currentColor; padding: 5px 8px; border-radius: 2px; }
.mini:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---------- App chrome ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#top {
  position: fixed; z-index: 20; left: 0; right: 0; top: 0;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 12px;
  border-width: 0 0 1px;
}
.mark { flex-shrink: 0; width: 30px; height: 30px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 800 17px var(--f-display); }
body.xray .mark { background: var(--bp-line); color: var(--bp-deep); font-family: var(--f-pixel); font-weight: 400; font-size: 22px; }
.file { font: 500 13px var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.file b { color: var(--fg); font-weight: 500; }

/* ---------- palette (eyedropper drives this) ---------- */
const DEFAULT_ACCENT = '#9ccc87';
const PAL = {};
function setAccent(hex, quiet) {
  const rgb = hexToRgb(hex); let [h, s, l] = rgbToHsl(...rgb);
  // keep the accent readable on the dark chrome
  l = clamp(l, 52, 78); s = Math.min(s, 85);
  const acc = hsl(h, s, l), ts = Math.min(s, 45);
  Object.assign(PAL, {
    accent: acc, h,
    bg0: hsl(h, Math.min(ts, 30), 7), bg1: hsl(h, Math.min(ts, 35), 16),
    paper: hsl(h, Math.min(ts, 18), 90), ink: hsl(h, Math.min(ts, 25), 7), deep: hsl(h, Math.min(ts, 25), 6),
  });
  const r = document.documentElement.style;
  r.setProperty('--accent', acc);
  r.setProperty('--accent-ink', lum(hexToRgb(acc)) > .45 ? PAL.ink : PAL.paper);
  r.setProperty('--bg-0', PAL.bg0); r.setProperty('--bg-1', PAL.bg1);
  r.setProperty('--paper', PAL.paper); r.setProperty('--ink', PAL.ink); r.setProperty('--deep', PAL.deep);
  r.setProperty('--panel', hsl(h, Math.min(ts, 22), 8) + 'e6');
  r.setProperty('--line', hsl(h, Math.min(ts, 18), 22));
  r.setProperty('--fg', hsl(h, Math.min(ts, 18), 90));
  r.setProperty('--muted', hsl(h, Math.min(ts, 12), 62));
  bgColors = [hexToRgb(PAL.bg0), hexToRgb(PAL.bg1)];
  redither();
  if (!quiet) renderInspector();
}

/* ---------- dithering of images ---------- */
const dithers = []; // {src: canvas|img, out: canvas, cell, kind}
function ditherOne(d) {
  const { src, out, cell } = d;
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  if (!sw) return;
  const w = Math.max(1, Math.round(sw / cell)), h = Math.max(1, Math.round(sh / cell));
  out.width = w; out.height = h;
  const ctx = out.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, w, h);
  const id = ctx.getImageData(0, 0, w, h), p = id.data;
  // duotone inks: art mode uses the board palette, x-ray uses blueprint blues
  const ink = xray ? [22, 34, 150] : hexToRgb(d.kind === 'work' ? PAL.deep : PAL.ink);
  const paper = xray ? [140, 214, 242] : hexToRgb(d.kind === 'paper' ? PAL.paper : PAL.accent);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    let L = (.299 * p[i] + .587 * p[i + 1] + .114 * p[i + 2]) / 255;
    L = clamp((L - .5) * 1.3 + .52, 0, 1);
    const c = L > BAYER[((y & 7) << 3) | (x & 7)] ? paper : ink;
    p[i] = c[0]; p[i + 1] = c[1]; p[i + 2] = c[2]; p[i + 3] = 255;
  }
  ctx.putImageData(id, 0, 0);
}
function redither() { dithers.forEach(ditherOne); }

/* ---------- procedural placeholders (colorful on purpose: try the eyedropper) ---------- */
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function placeholder(i) {
  const c = document.createElement('canvas'); c.width = 640; c.height = 480;
  const g = c.getContext('2d'), R = rng(i * 977 + 13), W = 640, H = 480;
  const disp = '800 120px "Bricolage Grotesque", sans-serif';
  if (i === 0) {
    g.fillStyle = '#ff6a2b'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#141414'; g.beginPath(); g.arc(420, 230, 170, 0, 7); g.fill();
    g.fillStyle = '#f4efe2'; g.font = disp; g.fillText('POSTER', 30, 440);
    g.fillStyle = '#2b5cff'; g.fillRect(40, 40, 120, 120);
  } else if (i === 1) {
    g.fillStyle = '#f2ead8'; g.fillRect(0, 0, W, H);
    const cols = ['#e83f6f', '#2274a5', '#ffbf00', '#32936f', '#141414'];
    for (let k = 0; k < 14; k++) {
      g.save(); g.translate(R() * W, R() * H); g.rotate((R() - .5) * 1.2);
      g.fillStyle = cols[k % 5]; g.fillRect(-90 * R() - 40, -60 * R() - 30, 180 * R() + 60, 120 * R() + 50); g.restore();
    }
  } else if (i === 2) {
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#2d0b59'); gr.addColorStop(.55, '#ff4f79'); gr.addColorStop(1, '#ffd166');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.fillStyle = '#ffd166'; g.beginPath(); g.arc(W / 2, 300, 120, Math.PI, 0); g.fill();
    g.fillStyle = '#2d0b59'; for (let k = 0; k < 7; k++) g.fillRect(0, 300 + k * 26, W, 10 + k * 2);
  } else if (i === 3) {
    g.fillStyle = '#f4f1ea'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#111'; g.font = '800 210px "Bricolage Grotesque", sans-serif'; g.fillText('Aa', 30, 300);
    g.fillStyle = '#d7263d'; g.fillRect(380, 40, 220, 400);
    g.fillStyle = '#111'; for (let k = 0; k < 9; k++) g.fillRect(40, 340 + k * 14, 300 - (k % 3) * 60, 5);
  } else if (i === 4) {
    g.fillStyle = '#0e7c66'; g.fillRect(0, 0, W, H);
    for (let y = 0; y < 8; y++) for (let x = 0; x < 10; x++) {
      g.fillStyle = (x + y) % 3 ? '#f7e6c4' : '#ff7f11';
      g.beginPath(); g.arc(40 + x * 64, 30 + y * 60, 6 + ((x * y) % 5) * 5, 0, 7); g.fill();
    }
  } else {
    g.fillStyle = '#e9ecf5'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#3a36db'; g.fillRect(40, 40, 560, 70);
    g.fillStyle = '#c8cde0'; for (let k = 0; k < 3; k++) g.fillRect(40 + k * 192, 140, 176, 210);
    g.fillStyle = '#ff5c8a'; g.fillRect(40, 380, 220, 56);
    g.fillStyle = '#1b1b2f'; g.fillRect(70, 170, 110, 12); g.fillRect(262, 170, 110, 12); g.fillRect(454, 170, 110, 12);
  }
  return c;
}

/* hook up dither canvases */
function registerDithers() {
  const pfpImg = document.querySelector('.pfp img');
  const pfpOut = document.querySelector('.pfp .dith');
  const d = { src: pfpImg, out: pfpOut, cell: 2, kind: 'pfp' };
  dithers.push(d);
  if (pfpImg.complete) ditherOne(d); else pfpImg.onload = () => ditherOne(d);

  const SETS = { works: WORKS, photos: PHOTOS, about: [{ title: 'Portrait', src: PROFILE.portrait }] };
  document.querySelectorAll('.frame').forEach(fr => {
    const w = SETS[fr.dataset.set][fr.dataset.i];
    const out = fr.querySelector('.dith');
    let src;
    const rec = { src: null, out, cell: fr.dataset.set === 'about' ? 3 : 4, kind: fr.dataset.kind };
    if (w.src) {
      src = new Image(); src.className = 'src'; src.alt = w.title;
      src.onload = () => ditherOne(rec); src.src = w.src;
    } else {
      src = placeholder(+fr.dataset.i); src.className = 'src';
    }
    rec.src = src;
    fr.insertBefore(src, out);
    dithers.push(rec);
    if (!w.src) ditherOne(rec);
  });
  document.querySelectorAll('.scrib').forEach(c => scribble(c, +c.dataset.seed));
}

/* ---------- camera ---------- */
const cam = { x: 0, y: 0, z: 1 };
function viewRect() {
  const W = innerWidth, H = innerHeight, phone = W <= 760;
  const l = phone ? 12 : 72, t = 60, r = phone ? 12 : 290, bt = phone ? 76 : 40;
  return { x: l, y: t, w: Math.max(100, W - l - r), h: Math.max(100, H - t - bt) };
}
function applyCam() {
  world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  document.documentElement.style.setProperty('--z', cam.z);
  $('#zoomBtn').textContent = Math.round(cam.z * 100) + '%';
  bgDirty = true;
}
const toWorld = (sx, sy) => [(sx - cam.x) / cam.z, (sy - cam.y) / cam.z];
function camFor(r, pad = 40) {
  const v = viewRect();
  pad = Math.min(pad, v.w * .04);
  const z = clamp(Math.min((v.w - pad * 2) / r.w, (v.h - pad * 2) / r.h), .05, 2.5);
  return { z, cx: r.x + r.w / 2, cy: r.y + r.h / 2 };
}
function setCenter(cx, cy, z) {
  const v = viewRect();
  cam.z = z; cam.x = v.x + v.w / 2 - cx * z; cam.y = v.y + v.h / 2 - cy * z; applyCam();
}
let flight = null;
function flyTo(r, pad, dur = 750) {
  const t = camFor(r, pad), v = viewRect();
  const from = { cx: (v.x + v.w / 2 - cam.x) / cam.z, cy: (v.y + v.h / 2 - cam.y) / cam.z, z: cam.z };
  if (REDUCED) { setCenter(t.cx, t.cy, t.z); return; }
  const t0 = performance.now();
  cancelAnimationFrame(flight);
  const step = now => {
    const k = clamp((now - t0) / dur, 0, 1), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    // zoom out a little mid-flight, like a camera hop
    const dip = Math.sin(Math.PI * e) * .18;
    const z = Math.exp(Math.log(from.z) + (Math.log(t.z) - Math.log(from.z)) * e) * (1 - dip);
    setCenter(from.cx + (t.cx - from.cx) * e, from.cy + (t.cy - from.cy) * e, z);
    if (k < 1) flight = requestAnimationFrame(step);
  };
  flight = requestAnimationFrame(step);
}
function bounds() {
  const xs = BOARDS.map(b => b.x), ys = BOARDS.map(b => b.y);
  const x = Math.min(...xs), y = Math.min(...ys);
  return { x, y, w: Math.max(...BOARDS.map(b => b.x + b.w)) - x, h: Math.max(...BOARDS.map(b => b.y + b.h)) - y };
}
const fitAll = (instant) => instant ? (() => { const t = camFor(bounds(), 30); setCenter(t.cx, t.cy, t.z); })() : flyTo(bounds(), 30);
function zoomAt(sx, sy, f) {
  cancelAnimationFrame(flight);
  const [wx, wy] = toWorld(sx, sy), z = clamp(cam.z * f, .05, 4);
  cam.z = z; cam.x = sx - wx * z; cam.y = sy - wy * z; applyCam();
}
const boardAt = (wx, wy) => BOARDS.slice().reverse().find(b => wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h);

/* red spray-marker strokes, like the ones across the PDF portfolio */
function scribble(canvas, seed) {
  const host = canvas.parentElement, W = canvas.width = Math.round(host.clientWidth / 2), H = canvas.height = Math.round(host.clientHeight / 2);
  const g = canvas.getContext('2d'), R = rng(seed * 7919 + 1);

    ? [[-.05, .3, .45, -.05, 1.05, .2, 13], [-.05, 1.02, .55, .72, 1.05, 1.05, 10]]
    : [[-.05, .2, .5, .02, 1.05, .1, 13], [.55, 1.05, .9, .55, 1.06, .42, 11], [-.05, .7, .15, .62, .3, .95, 8]];
  for (const [x0, y0, cx, cy, x1, y1, w] of strokes) {
    for (let i = 0; i <= 700; i++) {
      const t = i / 700, u = 1 - t;
      const x = (u * u * x0 + 2 * u * t * cx + t * t * x1) * W, y = (u * u * y0 + 2 * u * t * cy + t * t * y1) * H;

}

function drawEq(t) {
  const c = $('#eq'); if (!c) return;
  const g = c.getContext('2d'), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  const live = playing && analyser;
  if (live) { analyser.getByteFrequencyData(freqData); analyser.getByteTimeDomainData(timeData); }
  if (spotifyPlaying && !live) { // no audio access to the embed: draw a soft, song-paced motion instead
    if (xray) {
      g.fillStyle = '#6cc8ec';
      for (let x = 0; x < W; x++) g.fillRect(x, Math.round(H / 2 - Math.sin(x * .18 + t * 4) * Math.sin(x * .05 - t) * H * .38), 1, 1);
      return;
    }

    for (let i = 0; i < N; i++) {
      const v = .25 + .55 * Math.abs(Math.sin(t * 1.7 + i * .55) * Math.sin(t * .6 + i * .21));
      const blocks = Math.round(v * (H / 2));
      for (let b = 0; b < blocks; b++) { g.fillStyle = b === blocks - 1 ? PAL.accent : PAL.ink; g.fillRect(i * bw, H - (b + 1) * 2, bw - 1, 1); }
    }

  }
  if (xray) {
    g.fillStyle = 'rgba(108,200,236,.25)'; for (let x = 0; x < W; x += 10) g.fillRect(x, 0, 1, H); g.fillRect(0, H >> 1, W, 1);
    g.fillStyle = '#6cc8ec';

            + Math.sin(wy * 1.2 - t * .2 + Math.sin(wx * .7 - t * .1) * 1.5) * .8;
      const dx = x - mx, dy = y - my, d2 = dx * dx + dy * dy;
      if (d2 < R2 * 6) v += 1.4 * Math.exp(-d2 / R2) * Math.sin(Math.sqrt(d2) * .45 - t * 3);
      let band = v * 2.4; band -= Math.floor(band);           // contour lines
      const val = (.5 + .5 * Math.sin(v * 1.4)) * .62 + (band < .14 ? .38 : 0);
      bgBuf[y * W + x] = val > BAYER[((y & 7) << 3) | (x & 7)] ? u1 : u0;
    }
  }
  bgCtx.putImageData(bgImg, 0, 0);
}
let lastBg = 0;
function loop(now) {
  beat *= .86;
  if (spotifyPlaying && !REDUCED) beat = Math.max(beat, .3 * (.5 + .5 * Math.sin(now / 1000 * 2.2))); // slow breathing
  boardEls.cover.style.setProperty('--beat', beat.toFixed(3));
  drawEq(now / 1000);
  if (!document.hidden && (now - lastBg > 33) && (!REDUCED || bgDirty)) {
    if (xray) renderGrid(REDUCED ? 0 : now / 1000); else renderBg(REDUCED ? 0 : now / 1000);
    lastBg = now; bgDirty = false;
  }
  requestAnimationFrame(loop);
}


/* ---------- x-ray: retro perspective grid room ---------- */
const xg = $('#xg'), xgCtx = xg.getContext('2d');
const XCELL = 2; // drawn at half resolution, scaled up pixelated for chunky lines
function sizeXg() { xg.width = Math.ceil(innerWidth / XCELL); xg.height = Math.ceil(innerHeight / XCELL); bgDirty = true; }
function renderGrid(t) {
  const W = xg.width, H = xg.height, g = xgCtx;
  g.fillStyle = '#2d46d6'; g.fillRect(0, 0, W, H);
  const vx = W / 2, vy = H / 2;                        // vanishing point
  const band = H * .17;                                // empty middle strip, like a title zone
  const sp = clamp(W / 9 * Math.sqrt(cam.z), W / 22, W / 3); // column spacing grows with zoom
  const offX = ((cam.x / XCELL) % sp + sp) % sp;       // strafe with horizontal pan
  const phase = (((-cam.y / XCELL) / 120 + t * .18) % 1 + 1) % 1; // fly forward with vertical pan + time
  g.strokeStyle = '#6cc8ec'; g.lineWidth = 1.5; g.lineCap = 'square';
  for (const dir of [1, -1]) {                         // 1 = floor, -1 = ceiling
    const edge = dir > 0 ? H : 0, near = vy + dir * band;
    g.save(); g.beginPath();
    g.rect(0, Math.min(near, edge), W, Math.abs(edge - near)); g.clip();
    for (let j = 0; j < 26; j++) {                     // depth rows: y = near + (edge - near) / z
      const z = 1 + (j + 1 - phase) * .55;
      const y = Math.round(near + (edge - near) / z);
      g.globalAlpha = clamp(1.4 / z, .25, 1);
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }
    g.globalAlpha = 1;
    const reach = (edge - vy) / (near - vy);           // columns radiate from the vanishing point
    for (let i = -14; i <= 14; i++) {
      const bx = vx + (i * sp + offX - sp / 2) * reach;
      const nx = vx + (bx - vx) / reach;
      g.beginPath(); g.moveTo(nx, near); g.lineTo(bx, edge); g.stroke();
    }
    g.restore();
  }
  for (const y of [vy - band, vy + band]) {            // soft glow along both horizons
    const gr = g.createLinearGradient(0, y - 18, 0, y + 18);
    gr.addColorStop(0, 'rgba(108,200,236,0)'); gr.addColorStop(.5, 'rgba(108,200,236,.35)'); gr.addColorStop(1, 'rgba(108,200,236,0)');
    g.fillStyle = gr; g.fillRect(0, y - 18, W, 36);
  }
}
function makeNoise() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), id = g.createImageData(128, 128), p = id.data;
  for (let i = 0; i < p.length; i += 4) { const v = Math.random() * 255; p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 90; }
  g.putImageData(id, 0, 0);
  document.documentElement.style.setProperty('--noise', `url(${c.toDataURL()})`);
}

/* ---------- mode switch with a dither dissolve ---------- */
const fx = $('#fx'), fxCtx = fx.getContext('2d');
function setMode(on, ox = innerWidth / 2, oy = innerHeight / 2) {
  if (on === xray) return;
  const swap = () => {
    xray = on;
    document.body.classList.toggle('xray', on);
    $('#modeArt').setAttribute('aria-pressed', !on); $('#modeX').setAttribute('aria-pressed', on);
    $('#smode').textContent = on ? 'Tech mode' : 'Art mode';
    $('#sideTip').innerHTML = on ? 'Tech mode shows the build: grids, sizes, type specs and block diagrams. Press <b>T</b> to go back to art.'
                                 : 'Click a layer to fly there. Press <b>T</b> for the tech side.';
    redither(); applyCam(); renderInspector(); bgDirty = true;
  };
  if (REDUCED) { swap(); return; }
  const C = 10, W = Math.ceil(innerWidth / C), H = Math.ceil(innerHeight / C);
  fx.width = W; fx.height = H;
  const img = fxCtx.createImageData(W, H), buf = new Uint32Array(img.data.buffer);
  const col = hexToRgb(on ? '#2d46d6' : PAL.bg0), u = (255 << 24) | (col[2] << 16) | (col[1] << 8) | col[0];
  const keys = new Float32Array(W * H), maxD = Math.hypot(Math.max(ox, innerWidth - ox), Math.max(oy, innerHeight - oy)) / C;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    keys[y * W + x] = Math.hypot(x - ox / C, y - oy / C) / maxD * .75 + BAYER[((y & 7) << 3) | (x & 7)] * .25;
  const T = 300, t0 = performance.now(); let swapped = false;
  const step = now => {
    const k = (now - t0) / T;
    if (k < 1) { for (let i = 0; i < buf.length; i++) buf[i] = keys[i] <= k ? u : 0; }
    else {
      if (!swapped) { swap(); swapped = true; }
      const q = k - 1; for (let i = 0; i < buf.length; i++) buf[i] = keys[i] > q ? u : 0;
    }
    fxCtx.putImageData(img, 0, 0);
    if (k < 2) requestAnimationFrame(step); else fxCtx.clearRect(0, 0, W, H);
  };
  requestAnimationFrame(step);
}
$('#modeArt').addEventListener('click', e => setMode(false, e.clientX, e.clientY));
$('#modeX').addEventListener('click', e => setMode(true, e.clientX, e.clientY));

/* ---------- quick view (plain, fast version for recruiters & clients) ---------- */
function renderQV() {
  $('#qvIn').innerHTML = `
    <div class="qv-top"><span class="eyebrow">${esc(PROFILE.eyebrow)}</span><button class="btn" id="qvClose">Back to canvas</button></div>
    <div><h1>${esc(PROFILE.short)}</h1><p style="font:500 22px/1.3 var(--f-display);margin-top:18px;max-width:30ch">“${esc(PROFILE.thesis)}”</p><p style="font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px">— ${esc(PROFILE.thesisBy)}</p></div>
    <section><h2>About</h2><p>${esc(PROFILE.about)}</p><p style="margin-top:10px;color:var(--muted)">${esc(PROFILE.heading)}</p></section>
    <section><h2>Skills</h2><div class="qv-list">
      <div class="qv-item"><b>Design</b><small>${PROFILE.design.map(esc).join(' · ')}</small></div>
      <div class="qv-item"><b>Tools</b><small>${PROFILE.tools.map(esc).join(' · ')} · ${esc(PROFILE.camera)}</small></div>
      <div class="qv-item"><b>Tech</b><small>${PROFILE.tech.map(esc).join(' · ')}</small></div></div></section>
    <section><h2>Tech projects</h2><div class="qv-list">${PROJECTS.filter(p => !p.ghost).map(p => `
      <div class="qv-item"><b>${esc(p.title)}</b><span>${esc(p.blurb)}</span><small>${p.tags.map(esc).join(' · ')}</small></div>`).join('')}</div></section>
    <section><h2>Designs</h2><div class="qv-list">${WORKS.map(w => `
      <div class="qv-item"><b>${esc(w.title)}</b><small>${esc(w.type)}${w.year ? ' · ' + esc(w.year) : ''}</small></div>`).join('')}</div></section>
    <section><h2>Documentation</h2><p>${PHOTOS.length} photos from events, sports and the street, shot on a ${esc(PROFILE.camera)}.</p></section>
    <section><h2>${esc(MUSIC.label)}</h2><p><a href="${MUSIC.href}" target="_blank" rel="noopener" style="color:inherit">${esc(MUSIC.track)} · ${esc(MUSIC.artist)}</a></p></section>
    <section><h2>Contact</h2><div class="qv-list">${CONTACT.map(c => `
      <div class="qv-item"><small>${esc(c.k)}</small>${c.href ? `<a href="${c.href}" target="_blank" rel="noopener" style="color:inherit">${esc(c.v)}</a>` : `<code style="user-select:text">${esc(c.v)}</code>`}</div>`).join('')}</div></section>`;
}
function openQV(open) {
  const q = $('#qv'); q.hidden = !open;
  if (open) { renderQV(); $('#qvClose').focus(); } else $('#qvBtn').focus();
}
$('#qvBtn').addEventListener('click', () => openQV(true));
$('#qv').addEventListener('click', e => { if (e.target.id === 'qvClose') openQV(false); });

/* ---------- misc buttons ---------- */
$('#zoomBtn').addEventListener('click', () => fitAll());
$('#layersBtn').addEventListener('click', () => {
  const s = $('#side'), o = !s.classList.contains('open'); s.classList.toggle('open', o);
  $('#layersBtn').setAttribute('aria-expanded', o);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const v = b.dataset.copy;
  const fallback = () => { const code = b.previousElementSibling; const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Ctrl+C to copy.'); };
  try { navigator.clipboard.writeText(v).then(() => toast('Copied ' + v), fallback); } catch (_) { fallback(); }
});

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (!$('#qv').hidden) { if (e.key === 'Escape') openQV(false); return; }
  if (e.code === 'Space' && !e.repeat) { spaceHand = true; updateCursor(); e.preventDefault(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const map = { v: 'move', h: 'hand', p: 'pen', i: 'drop', z: 'zoom' };
  if (map[k]) setTool(map[k]);
  else if (k === 'x' || k === 't') setMode(!xray, mouse.x > 0 ? mouse.x : undefined, mouse.y > 0 ? mouse.y : undefined);
  else if (k === 'q') openQV(true);
  else if (k === '0') fitAll();
  else if (k >= '1' && k <= '6') goBoard(ORDER[+k - 1]);
  else if (k === '+' || k === '=') zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
  else if (k === '-') zoomAt(innerWidth / 2, innerHeight / 2, .8);
  else if (k === 'escape') { select(null); $('#loupe').style.display = 'none'; }
});
addEventListener('keyup', e => { if (e.code === 'Space') { spaceHand = false; updateCursor(); } });

/* ---------- intro: the page develops out of a dither, from the center ---------- */
function introReveal() {
  if (REDUCED) return;
  const C = 10, W = Math.ceil(innerWidth / C), H = Math.ceil(innerHeight / C);
  fx.width = W; fx.height = H;
  const img = fxCtx.createImageData(W, H), buf = new Uint32Array(img.data.buffer);
  const col = hexToRgb(PAL.ink), u = (255 << 24) | (col[2] << 16) | (col[1] << 8) | col[0];
  const keys = new Float32Array(W * H), cx = W / 2, cy = H / 2, maxD = Math.hypot(cx, cy);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    keys[y * W + x] = Math.hypot(x - cx, y - cy) / maxD * .7 + BAYER[((y & 7) << 3) | (x & 7)] * .3;
  const t0 = performance.now(), T = 900;
  const step = now => {
    const q = (now - t0) / T;
    for (let i = 0; i < buf.length; i++) buf[i] = keys[i] > q ? u : 0;
    fxCtx.putImageData(img, 0, 0);
    if (q < 1) requestAnimationFrame(step); else fxCtx.clearRect(0, 0, W, H);
  };
  requestAnimationFrame(step);
}

/* ---------- boot ---------- */
let userMoved = false;
addEventListener('resize', () => { sizeBg(); sizeXg(); applyCam(); });
setAccent(DEFAULT_ACCENT, true);
sizeBg();
sizeXg();
makeNoise();
fitAll(true);
introReveal();
select(null);
setTool('move', true);
requestAnimationFrame(loop);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  registerDithers();
  initCover();
  initDocs();
  setTimeout(() => {
    if (!userMoved) { goBoard('cover'); }
    toast('Pick a tool on the left. Press T for the tech side.');
  }, 900);
});
</script>
